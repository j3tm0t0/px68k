# Speed of each optimization group on an x86 host (tools/bench/bench.py):
# synthetic 68000 programs, MFP, fmgen and line rendering, no ROMs or disk
# images.  The table goes to the job summary.
name: bench

# Run by hand (Actions > bench > Run workflow): about 30 minutes.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: rounds (each variant once per round)
        default: '7'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the older revisions the variants are built from
      - name: 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: host
        run: |
          { echo '### runner'; echo; echo '```'; lscpu | grep -E 'Model name|^CPU\(s\)|MHz'; gcc --version | head -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: bench
        env:
          CC: gcc -m32
          CXX: g++ -m32
        run: python3 tools/bench/bench.py --rounds "${{ github.event.inputs.rounds || '7' }}" --json bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
